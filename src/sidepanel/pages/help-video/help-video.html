<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Assistant - Help Video</title>
    <link rel="stylesheet" href="help-video.css">
    <script src="help-video.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🎥 AI Prompt Assistant
                <span style="font-size: 18px;">- Help Video</span>
            </h1>
            <p>Learn to use the extension easily and quickly</p>
        </div>

        <div class="error-message" id="error-message">
            ⚠️ Error loading video. Please check your internet connection and try again.
        </div>

        <div class="video-container">
            <div class="success-indicator" id="success-indicator">
                ✅ Video loaded successfully
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Loading video...
            </div>
            <iframe 
                id="video-iframe"
                class="video-iframe"
                src="https://www.youtube.com/embed/40AoSd_o7Z8?autoplay=1&rel=0&showinfo=0&modestbranding=1&iv_load_policy=3&fs=1&cc_load_policy=0&disablekb=0&controls=1&playsinline=1&mute=0"
                title="AI Prompt Assistant - Help Video"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer">
            <p>🚀 Thank you for using AI Prompt Assistant!</p>
            <button class="close-button" onclick="closeWindow()">
                ✨ Close and start using the extension
            </button>
        </div>
    </div>

    <!-- La funcionalidad JavaScript principal está en help-video.js -->
    <script>
        // Fallback básico en caso de que el archivo JS externo no se cargue
        window.addEventListener('load', function() {
            // Verificar si el manager se inicializó correctamente
            setTimeout(() => {
                if (!window.helpVideoDebug) {
                    console.warn('⚠️ El script principal no se cargó, usando fallback básico');
                    
                    // Funcionalidad mínima de respaldo
                    const iframe = document.getElementById('video-iframe');
                    const loading = document.getElementById('loading');
                    
                    if (iframe && loading) {
                        iframe.addEventListener('load', () => {
                            loading.style.display = 'none';
                            console.log('✅ Video cargado (fallback)');
                        });
                        
                        iframe.addEventListener('error', () => {
                            loading.style.display = 'none';
                            const error = document.getElementById('error-message');
                            if (error) error.style.display = 'block';
                            console.error('❌ Error al cargar video (fallback)');
                        });
                    }
                    
                    // Función básica para cerrar (fallback mejorado)
                    window.closeWindow = () => {
                        console.log('🚪 Cerrando ventana (fallback)...');
                        
                        // Intentar múltiples métodos
                        try {
                            // Método principal
                            window.close();
                            
                            // Si no funciona, intentar con delay
                            setTimeout(() => {
                                window.close();
                            }, 100);
                            
                            // Método con Chrome API si está disponible
                            if (typeof chrome !== 'undefined' && chrome.tabs) {
                                chrome.tabs.getCurrent((tab) => {
                                    if (tab && tab.id) {
                                        chrome.tabs.remove(tab.id);
                                    }
                                });
                            }
                            
                            // Fallback con history
                            setTimeout(() => {
                                if (window.history.length > 1) {
                                    window.history.back();
                                } else {
                                    window.close();
                                }
                            }, 200);
                            
                        } catch (error) {
                            console.error('Error en fallback de cierre:', error);
                            
                            // Último recurso: mostrar mensaje
                            setTimeout(() => {
                                alert('Please close this tab manually');
                            }, 500);
                        }
                    };
                }
            }, 1000);
        });
    </script>
</body>
</html>
